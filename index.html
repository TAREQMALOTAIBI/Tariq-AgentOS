    <script>
      // Ignore Vite HMR / WebSocket transport errors as per environment constraints
      (function() {
        if (typeof window === 'undefined') return;

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var fn = (e && e.filename) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('createWebSocketModuleRunnerTransport') ||
            fn.includes('@vite/client') ||
            (e.error && e.error.stack && e.error.stack.includes('createWebSocketModuleRunnerTransport'))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
          if (
            reason.includes('WebSocket') ||
            reason.includes('createWebSocketModuleRunnerTransport') ||
            reason.includes('@vite/client')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        if (window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            try {
              var ws = new NativeWebSocket(url, protocols);
              ws.addEventListener('error', function(err) {
                if (err && err.stopImmediatePropagation) err.stopImmediatePropagation();
              });
              return ws;
            } catch (err) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                readyState: 3
              };
            }
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }
      })();
    </script>
  </head>

  </body>
